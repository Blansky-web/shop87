<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop87 — Abbigliamento e Accessori di Lusso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>
:root{--bg-primary:#0a0a0a;--bg-secondary:#141414;--ruby-red:#8B0000;--ruby-dark:#5C0000;--gold:#D4AF37;--gold-light:#F4D03F;--gold-dark:#996515;--white:#FFFFFF;--text-secondary:#A8A8A8;--text-muted:#6B6B6B;--border:rgba(212,175,55,0.15);--border-hover:rgba(212,175,55,0.5);--shadow-lg:0 20px 60px rgba(0,0,0,0.6);--shadow-glow:0 0 30px rgba(212,175,55,0.3);--t-fast:0.2s cubic-bezier(0.4,0,0.2,1);--t-smooth:0.4s cubic-bezier(0.16,1,0.3,1)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg-primary);color:var(--white);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.shipping-banner{background:linear-gradient(90deg,var(--ruby-dark),var(--ruby-red),var(--ruby-dark));color:var(--gold-light);text-align:center;padding:12px 20px;font-size:.75rem;letter-spacing:3px;text-transform:uppercase;font-weight:500;border-bottom:1px solid var(--border);position:relative;overflow:hidden}
.shipping-banner::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(244,208,63,.15),transparent);animation:shine 4s infinite}
@keyframes shine{0%{left:-100%}50%,100%{left:100%}}
.header{background:rgba(10,10,10,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:30px 20px;text-align:center;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;transition:padding var(--t-smooth)}
.header.scrolled{padding:15px 20px}
.logo{font-family:'Cormorant Garamond',serif;font-size:3.5rem;font-weight:500;background:linear-gradient(135deg,var(--gold-light) 0%,var(--gold) 40%,var(--gold-dark) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:8px;margin-bottom:8px;line-height:1;position:relative;display:inline-block;animation:fadeInDown .8s cubic-bezier(.16,1,.3,1);transition:font-size var(--t-smooth)}
.header.scrolled .logo{font-size:2.5rem}
@keyframes fadeInDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
.instagram-link{color:var(--text-secondary);text-decoration:none;font-size:.75rem;letter-spacing:3px;text-transform:uppercase;transition:color var(--t-fast);position:relative;padding-bottom:3px}
.instagram-link::after{content:'';position:absolute;bottom:0;left:50%;width:0;height:1px;background:var(--gold);transition:all var(--t-smooth);transform:translateX(-50%)}
.instagram-link:hover{color:var(--gold)}
.instagram-link:hover::after{width:100%}
.nav-menu{background:rgba(10,10,10,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:18px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:99;display:flex;justify-content:flex-start;align-items:center}
.category-dropdown{position:relative;display:inline-block}
.category-btn{background:transparent;color:var(--white);border:1px solid var(--border-hover);padding:12px 24px;cursor:pointer;font-family:'Inter',sans-serif;font-size:.8rem;font-weight:500;letter-spacing:3px;text-transform:uppercase;display:flex;align-items:center;gap:12px;transition:all var(--t-smooth);position:relative;overflow:hidden}
.category-btn:hover{border-color:var(--gold);color:var(--gold-light);letter-spacing:4px}
.category-btn::after{content:'▼';font-size:.6rem;transition:transform var(--t-smooth);color:var(--gold)}
.category-btn.open::after{transform:rotate(180deg)}
.category-menu{display:none;position:absolute;top:calc(100% + 10px);left:0;background:rgba(20,20,20,.98);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--border-hover);min-width:260px;max-height:400px;overflow-y:auto;z-index:200;box-shadow:var(--shadow-lg)}
.category-menu.open{display:block}
.category-menu::-webkit-scrollbar{width:6px}
.category-menu::-webkit-scrollbar-thumb{background:var(--gold-dark)}
.category-item{display:block;width:100%;padding:14px 24px;background:transparent;color:var(--text-secondary);border:none;border-bottom:1px solid rgba(212,175,55,.08);text-align:left;cursor:pointer;font-family:'Inter',sans-serif;font-size:.8rem;letter-spacing:2px;text-transform:uppercase;transition:all var(--t-fast);position:relative}
.category-item:last-child{border-bottom:none}
.category-item::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:0;height:1px;background:var(--gold);transition:width var(--t-smooth)}
.category-item:hover{color:var(--gold-light);padding-left:36px;background:rgba(212,175,55,.05)}
.category-item:hover::before{width:20px}
.category-item.active{color:var(--gold);font-weight:600;background:rgba(139,0,0,.15)}
.category-item.active::before{width:20px}
.products-container{max-width:1400px;margin:0 auto;padding:60px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:30px}
.product-card{background:var(--bg-secondary);border:1px solid rgba(212,175,55,.08);overflow:hidden;transition:all var(--t-smooth);position:relative;animation:fadeInUp .6s cubic-bezier(.16,1,.3,1)}
@keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.product-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);transform:scaleX(0);transition:transform var(--t-smooth);z-index:5}
.product-card:hover::before{transform:scaleX(1)}
.product-card:hover{transform:translateY(-8px);border-color:var(--border-hover);box-shadow:var(--shadow-lg),var(--shadow-glow)}
.product-card.sold-out{opacity:.5}
.product-card.sold-out:hover{transform:none}
.product-image-container{position:relative;width:100%;aspect-ratio:1;overflow:hidden;background:#0a0a0a;touch-action:pan-y;user-select:none}
.product-image{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;transition:transform .8s cubic-bezier(.16,1,.3,1)}
.product-card:hover .product-image{transform:scale(1.08)}
.sold-out-badge{position:absolute;top:20px;right:20px;background:rgba(139,0,0,.95);backdrop-filter:blur(10px);color:var(--white);padding:8px 16px;font-weight:600;letter-spacing:3px;border:1px solid var(--gold);font-size:.65rem;text-transform:uppercase;z-index:10}
.image-gallery{position:relative}
.gallery-nav{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:10;padding:8px 14px;background:rgba(10,10,10,.7);backdrop-filter:blur(10px);border-radius:100px;border:1px solid var(--border)}
.gallery-dot{width:8px;height:8px;background:rgba(255,255,255,.4);border-radius:50%;cursor:pointer;border:none;transition:all var(--t-smooth)}
.gallery-dot:hover{background:rgba(255,255,255,.7)}
.gallery-dot.active{background:var(--gold);transform:scale(1.4);box-shadow:0 0 10px rgba(212,175,55,.8)}
.model-3d-btn{position:absolute;top:20px;left:20px;background:rgba(10,10,10,.85);backdrop-filter:blur(10px);color:var(--gold-light);border:1px solid var(--gold);padding:8px 14px;cursor:pointer;z-index:10;font-size:.65rem;letter-spacing:2px;text-transform:uppercase;font-weight:500;transition:all var(--t-fast)}
.model-3d-btn:hover{background:var(--gold);color:var(--bg-primary);transform:translateY(-2px)}
.product-info{padding:24px;display:flex;flex-direction:column;gap:12px}
.product-name{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:500;color:var(--white);letter-spacing:.5px;line-height:1.3;transition:color var(--t-fast)}
.product-card:hover .product-name{color:var(--gold-light)}
.product-category{font-size:.65rem;color:var(--text-muted);letter-spacing:3px;text-transform:uppercase;font-weight:500}
.product-price{font-size:1.3rem;color:var(--gold);font-weight:600;letter-spacing:1px;margin-top:4px}
/* ============ SELETTORE TAGLIE MODERNIZZATO ============ */
.size-selector-wrapper{position:relative;width:100%}
.size-selector{width:100%;padding:14px 42px 14px 16px;background:linear-gradient(135deg,rgba(20,20,20,.95),rgba(10,10,10,.95));color:var(--gold-light);border:1px solid var(--border);font-family:'Inter',sans-serif;font-size:.7rem;font-weight:500;letter-spacing:3px;text-transform:uppercase;cursor:pointer;transition:all var(--t-smooth);appearance:none;-webkit-appearance:none;-moz-appearance:none;background-image:url("data:image/svg+xml;charset=US-ASCII,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23D4AF37' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 16px center;background-size:14px;outline:none;position:relative;overflow:hidden}
.size-selector:hover{border-color:var(--gold);color:var(--gold-light);background:linear-gradient(135deg,rgba(30,20,20,.95),rgba(15,10,10,.95));letter-spacing:4px;box-shadow:0 0 20px rgba(212,175,55,.15)}
.size-selector:focus{outline:none;border-color:var(--gold);color:var(--gold-light);box-shadow:0 0 0 3px rgba(212,175,55,.15),0 0 30px rgba(212,175,55,.2)}
.size-selector option{background:#0f0f0f;color:var(--white);padding:16px 20px;font-family:'Inter',sans-serif;font-size:.75rem;letter-spacing:2px;text-transform:uppercase;font-weight:500;line-height:2}
.size-selector option:hover,.size-selector option:checked{background:linear-gradient(90deg,var(--ruby-red),var(--ruby-dark));color:var(--gold-light)}
.size-selector::-webkit-scrollbar{width:6px}
.size-selector::-webkit-scrollbar-track{background:#0a0a0a}
.size-selector::-webkit-scrollbar-thumb{background:var(--gold-dark);border-radius:3px}
.size-selector::-webkit-scrollbar-thumb:hover{background:var(--gold)}
.buy-button{width:100%;padding:14px;background:transparent;color:var(--white);border:1px solid var(--border-hover);cursor:pointer;font-family:'Inter',sans-serif;font-size:.75rem;font-weight:600;letter-spacing:4px;text-transform:uppercase;transition:all var(--t-smooth);position:relative;overflow:hidden;margin-top:8px}
.buy-button::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,var(--ruby-red),var(--ruby-dark));transition:left var(--t-smooth);z-index:-1}
.buy-button:hover::before{left:0}
.buy-button:hover{border-color:var(--gold);color:var(--gold-light);letter-spacing:5px}
.buy-button:active{transform:scale(.98)}
.buy-button.sold-out-btn{background:transparent;border-color:rgba(255,255,255,.1);color:var(--text-muted);cursor:not-allowed;letter-spacing:3px}
.buy-button.sold-out-btn::before{display:none}
.buy-button.sold-out-btn:hover{border-color:rgba(255,255,255,.1);color:var(--text-muted);letter-spacing:3px}
model-viewer{width:100%;height:100%;background:#0a0a0a}
.footer{background:var(--bg-secondary);text-align:center;padding:60px 20px 40px;margin-top:80px;border-top:1px solid var(--border);position:relative}
.footer::before{content:'';position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:200px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.footer .logo{font-size:2.5rem;letter-spacing:6px;margin-bottom:20px}
.footer-text{color:var(--text-muted);margin-top:24px;font-size:.75rem;letter-spacing:2px;text-transform:uppercase;line-height:2}
.footer-text p:last-child{color:var(--gold);margin-top:16px;font-weight:500}
.empty-message{text-align:center;width:100%;grid-column:1/-1;padding:80px 20px;color:var(--text-muted);font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-style:italic;letter-spacing:1px}
@keyframes slideUpNotif{from{opacity:0;transform:translateX(-50%) translateY(30px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.copy-notification{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,var(--ruby-red),var(--ruby-dark));color:var(--gold-light);padding:16px 24px;border:1px solid var(--gold);border-radius:8px;font-family:'Inter',sans-serif;font-size:.85rem;letter-spacing:1px;z-index:9999;box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 20px rgba(212,175,55,.3);animation:slideUpNotif .4s cubic-bezier(.16,1,.3,1);max-width:90%;text-align:center;font-weight:500}
@media(max-width:768px){
.header{padding:20px 15px}
.header.scrolled{padding:12px 15px}
.logo{font-size:2.2rem;letter-spacing:5px}
.header.scrolled .logo{font-size:1.8rem}
.shipping-banner{font-size:.65rem;letter-spacing:2px;padding:10px 15px}
.nav-menu{padding:14px 15px}
.category-btn{padding:10px 18px;font-size:.7rem;letter-spacing:2px}
.products-container{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:30px 12px}
.product-info{padding:14px;gap:8px}
.product-name{font-size:1rem}
.product-category{font-size:.6rem;letter-spacing:2px}
.product-price{font-size:1rem;margin-top:2px}
.size-selector{padding:11px 34px 11px 12px;font-size:.65rem;letter-spacing:2px;background-position:right 12px center;background-size:12px}
.size-selector option{padding:12px 14px;font-size:.7rem;letter-spacing:1px}
.buy-button{padding:11px;font-size:.65rem;letter-spacing:2px}
.gallery-nav{gap:8px;padding:6px 12px}
.gallery-dot{width:6px;height:6px}
.sold-out-badge{top:12px;right:12px;padding:6px 10px;font-size:.55rem;letter-spacing:2px}
.footer{padding:40px 15px 30px;margin-top:50px}
.footer .logo{font-size:1.8rem;letter-spacing:4px}
.copy-notification{font-size:.75rem;padding:12px 18px;bottom:20px}
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg-primary)}
::-webkit-scrollbar-thumb{background:var(--gold-dark)}
::-webkit-scrollbar-thumb:hover{background:var(--gold)}
::selection{background:var(--gold);color:var(--bg-primary)}
</style>
</head>
<body>
<div class="shipping-banner">✦ Spedizioni disponibili in tutto il mondo ✦</div>
<header class="header" id="header">
<h1 class="logo">Shop87</h1>
<a href="https://instagram.com/87shopp_" class="instagram-link" target="_blank">@87shopp_</a>
</header>
<nav class="nav-menu" id="navMenu">
<div class="category-dropdown">
<button class="category-btn" id="categoryBtn" onclick="toggleCategoryMenu()">Categorie</button>
<div class="category-menu" id="categoryMenu"></div>
</div>
</nav>
<main class="products-container" id="productsContainer"></main>
<footer class="footer">
<h2 class="logo">Shop87</h2>
<a href="https://instagram.com/87shopp_" class="instagram-link" target="_blank">@87shopp_</a>
<div class="footer-text">
<p>✦ Spedizioni disponibili in tutto il mondo ✦</p>
<p>Contattaci su Instagram per acquisti</p>
</div>
</footer>
<script>
const productsData=[
{id:1,name:"Nike Air Jordan 1 Retro High",category:"Sneakers",price:"€180.00",sizes:["39","40","41","42","43","44"],available:true,images:["https://images.unsplash.com/photo-1549298916-b41d501d3772?w=800","https://images.unsplash.com/photo-1600269452121-4f2416e55c28?w=800","https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?w=800"],model3d:null,description:"Iconiche sneakers in pelle premium"},
{id:2,name:"Gucci Marmont Shoulder Bag",category:"Borsa",price:"€1.200,00",sizes:["Unica"],available:true,images:["https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=800","https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=800"],model3d:null,description:"Borsa iconica con hardware dorato"}
];
const categories=['Tutti','Sneakers','Scarpe da uomo','Scarpe da donna','Ciabatte','Giacca invernale','Giacca','Felpe','Pantaloni','Maglietta','Borsa','Tuta sportiva','Cintura','Cappello','Occhiali da sole','Orologio'];
let currentCategory='Tutti';
let currentImageIndex={};
let currentSizes={};

function init(){
renderNavMenu();
renderProducts();
setupScrollEffects();
}

function setupScrollEffects(){
const header=document.getElementById('header');
window.addEventListener('scroll',function(){
if(window.scrollY>80){header.classList.add('scrolled');}
else{header.classList.remove('scrolled');}
},{passive:true});
}

function renderNavMenu(){
const menu=document.getElementById('categoryMenu');
menu.innerHTML='';
categories.forEach(function(category){
const item=document.createElement('button');
item.className='category-item'+(category===currentCategory?' active':'');
item.textContent=category;
item.onclick=function(){
filterProducts(category);
closeCategoryMenu();
};
menu.appendChild(item);
});
}

function toggleCategoryMenu(){
const menu=document.getElementById('categoryMenu');
const btn=document.getElementById('categoryBtn');
menu.classList.toggle('open');
btn.classList.toggle('open');
}

function closeCategoryMenu(){
const menu=document.getElementById('categoryMenu');
const btn=document.getElementById('categoryBtn');
menu.classList.remove('open');
btn.classList.remove('open');
}

document.addEventListener('click',function(event){
const dropdown=document.querySelector('.category-dropdown');
if(dropdown&&!dropdown.contains(event.target)){
closeCategoryMenu();
}
});

function filterProducts(category){
currentCategory=category;
renderNavMenu();
renderProducts();
}

function renderProducts(){
const container=document.getElementById('productsContainer');
container.innerHTML='';
const filteredProducts=currentCategory==='Tutti'?productsData:productsData.filter(function(product){return product.category===currentCategory;});
if(filteredProducts.length===0){
container.innerHTML='<p class="empty-message">Nessun prodotto disponibile in questa categoria</p>';
return;
}
filteredProducts.forEach(function(product){
const card=createProductCard(product);
container.appendChild(card);
});
}

function createProductCard(product){
const card=document.createElement('div');
card.className='product-card'+(product.available?'':' sold-out');
const imageContainer=document.createElement('div');
imageContainer.className='image-gallery';
if(!product.available){
const soldOutBadge=document.createElement('div');
soldOutBadge.className='sold-out-badge';
soldOutBadge.textContent='Sold Out';
imageContainer.appendChild(soldOutBadge);
}
if(product.model3d){
const modelBtn=document.createElement('button');
modelBtn.className='model-3d-btn';
modelBtn.textContent='◉ Vista 3D';
modelBtn.onclick=function(){toggle3DModel(product.id);};
imageContainer.appendChild(modelBtn);
}
const imageContainerInner=document.createElement('div');
imageContainerInner.className='product-image-container';
imageContainerInner.id='image-container-'+product.id;
const img=document.createElement('img');
img.className='product-image';
img.src=product.images[0];
img.alt=product.name;
img.id='main-image-'+product.id;
img.loading='lazy';
imageContainerInner.appendChild(img);
if(product.images.length>1){
let touchStartX=0;
let touchEndX=0;
imageContainerInner.addEventListener('touchstart',function(e){touchStartX=e.changedTouches[0].screenX;},{passive:true});
imageContainerInner.addEventListener('touchend',function(e){touchEndX=e.changedTouches[0].screenX;handleSwipe(product.id,touchStartX,touchEndX);},{passive:true});
}
imageContainer.appendChild(imageContainerInner);
if(product.images.length>1){
const galleryNav=document.createElement('div');
galleryNav.className='gallery-nav';
product.images.forEach(function(image,index){
const dot=document.createElement('div');
dot.className='gallery-dot'+(index===0?' active':'');
dot.dataset.index=index;
dot.onclick=function(){changeImage(product.id,index);};
galleryNav.appendChild(dot);
});
imageContainer.appendChild(galleryNav);
}
card.appendChild(imageContainer);
const info=document.createElement('div');
info.className='product-info';
const name=document.createElement('h3');
name.className='product-name';
name.textContent=product.name;
info.appendChild(name);
const category=document.createElement('div');
category.className='product-category';
category.textContent=product.category;
info.appendChild(category);
const price=document.createElement('div');
price.className='product-price';
price.textContent=product.price;
info.appendChild(price);
if(product.sizes&&product.sizes.length>0){
const sizeSelector=document.createElement('select');
sizeSelector.className='size-selector';
sizeSelector.id='size-selector-'+product.id;
product.sizes.forEach(function(size){
const option=document.createElement('option');
option.value=size;
option.textContent='Taglia: '+size;
sizeSelector.appendChild(option);
});
sizeSelector.onchange=function(e){currentSizes[product.id]=e.target.value;};
currentSizes[product.id]=product.sizes[0];
info.appendChild(sizeSelector);
}
const buyButton=document.createElement('button');
buyButton.className='buy-button'+(product.available?'':' sold-out-btn');
if(product.available){
buyButton.textContent='Acquista Ora';
buyButton.onclick=function(){buyOnInstagram(product);};
}else{
buyButton.textContent='Esaurito';
buyButton.disabled=true;
}
info.appendChild(buyButton);
card.appendChild(info);
return card;
}

function handleSwipe(productId,startX,endX){
const swipeThreshold=50;
const diff=startX-endX;
const product=productsData.find(function(p){return p.id===productId;});
if(!product)return;
if(currentImageIndex[productId]===undefined){currentImageIndex[productId]=0;}
if(diff>swipeThreshold){
let newIndex=currentImageIndex[productId]+1;
if(newIndex>=product.images.length)newIndex=0;
changeImage(productId,newIndex);
}else if(diff<-swipeThreshold){
let newIndex=currentImageIndex[productId]-1;
if(newIndex<0)newIndex=product.images.length-1;
changeImage(productId,newIndex);
}
}

function changeImage(productId,index){
const img=document.getElementById('main-image-'+productId);
const product=productsData.find(function(p){return p.id===productId;});
if(!img||!product)return;
currentImageIndex[productId]=index;
img.src=product.images[index];
const card=img.closest('.product-card');
if(card){
const dots=card.querySelectorAll('.gallery-dot');
dots.forEach(function(dot,i){
if(i===index){dot.classList.add('active');}
else{dot.classList.remove('active');}
});
}
}

function toggle3DModel(productId){
const container=document.getElementById('image-container-'+productId);
const product=productsData.find(function(p){return p.id===productId;});
if(!product||!product.model3d)return;
if(container.querySelector('model-viewer')){
const modelViewer=container.querySelector('model-viewer');
modelViewer.remove();
const img=document.createElement('img');
img.className='product-image';
img.src=product.images[0];
img.alt=product.name;
img.id='main-image-'+productId;
container.appendChild(img);
}else{
container.innerHTML='';
const modelViewer=document.createElement('model-viewer');
modelViewer.src=product.model3d;
modelViewer.alt='Modello 3D di '+product.name;
modelViewer.setAttribute('auto-rotate','');
modelViewer.setAttribute('camera-controls','');
modelViewer.setAttribute('ar','');
modelViewer.setAttribute('ar-modes','webxr scene-viewer quick-look');
modelViewer.setAttribute('shadow-intensity','1');
modelViewer.style.width='100%';
modelViewer.style.height='100%';
container.appendChild(modelViewer);
}
}

// ============ ACQUISTA SU INSTAGRAM CON COPIA MESSAGGIO ============
function buyOnInstagram(product){
const size=currentSizes[product.id]||(product.sizes?product.sizes[0]:'');
const message='Ciao! Sono interessato all\'articolo: '+product.name+' (Taglia: '+size+'). È ancora disponibile?';
if(navigator.clipboard&&navigator.clipboard.writeText){
navigator.clipboard.writeText(message).then(function(){showCopyNotification();}).catch(function(){fallbackCopy(message);});
}else{
fallbackCopy(message);
}
const instagramUrl='https://ig.me/m/87shopp_';
window.open(instagramUrl,'_blank');
}

function fallbackCopy(text){
const textarea=document.createElement('textarea');
textarea.value=text;
textarea.style.position='fixed';
textarea.style.opacity='0';
document.body.appendChild(textarea);
textarea.select();
try{
document.execCommand('copy');
showCopyNotification();
}catch(err){
console.log('Copia fallita');
}
document.body.removeChild(textarea);
}

function showCopyNotification(){
const existing=document.querySelector('.copy-notification');
if(existing){existing.remove();}
const notification=document.createElement('div');
notification.className='copy-notification';
notification.textContent='✓ Messaggio copiato! Incollalo nella chat di Instagram';
document.body.appendChild(notification);
setTimeout(function(){
notification.style.opacity='0';
notification.style.transition='opacity .4s';
setTimeout(function(){
if(notification.parentNode){notification.parentNode.removeChild(notification);}
},400);
},4000);
}
