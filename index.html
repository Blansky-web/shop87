<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop87 - Abbigliamento e Accessori</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Model Viewer per modelli 3D -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --ruby-red: #8B0000;
            --ruby-dark: #5C0000;
            --gold: #D4AF37;
            --gold-light: #F4D03F;
            --gold-dark: #996515;
            --white: #FFFFFF;
            --text-secondary: #CCCCCC;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--white);
            line-height: 1.6;
        }

        /* Header e Banner */
        .shipping-banner {
            background: linear-gradient(90deg, var(--ruby-red), var(--ruby-dark), var(--ruby-red));
            color: var(--gold-light);
            text-align: center;
            padding: 10px;
            font-size: 0.9rem;
            letter-spacing: 1px;
            border-bottom: 2px solid var(--gold);
        }

        .header {
            background: var(--bg-secondary);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--gold);
        }

        .logo {
            font-family: 'Cinzel', serif;
            font-size: 3.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .instagram-link {
            color: var(--gold);
            text-decoration: none;
            font-size: 1.1rem;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        .instagram-link:hover {
            color: var(--gold-light);
        }

        /* Menu di navigazione con tendina */
        .nav-menu {
            background: var(--bg-secondary);
            padding: 15px 20px;
            border-bottom: 1px solid var(--gold-dark);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }

        .category-dropdown {
            position: relative;
            display: inline-block;
        }

        .category-btn {
            background: var(--ruby-red);
            color: var(--gold-light);
            border: 2px solid var(--gold);
            padding: 10px 20px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            border-radius: 4px;
            letter-spacing: 0.5px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .category-btn:hover {
            background: var(--ruby-dark);
            border-color: var(--gold-light);
        }

        .category-btn::after {
            content: '▼';
            font-size: 0.7rem;
        }

        .category-btn.open::after {
            content: '▲';
        }

        .category-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            margin-top: 5px;
            background: var(--bg-secondary);
            border: 2px solid var(--gold);
            border-radius: 4px;
            min-width: 220px;
            max-height: 350px;
            overflow-y: auto;
            z-index: 200;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        .category-menu.open {
            display: block;
        }

        .category-menu::-webkit-scrollbar {
            width: 8px;
        }

        .category-menu::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        .category-menu::-webkit-scrollbar-thumb {
            background: var(--gold);
            border-radius: 4px;
        }

        .category-item {
            display: block;
            width: 100%;
            padding: 12px 20px;
            background: transparent;
            color: var(--white);
            border: none;
            text-align: left;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            letter-spacing: 0.3px;
            transition: all 0.2s;
            border-bottom: 1px solid var(--gold-dark);
        }

        .category-item:last-child {
            border-bottom: none;
        }

        .category-item:hover {
            background: var(--ruby-red);
            color: var(--gold-light);
            padding-left: 28px;
        }

        .category-item.active {
            background: var(--ruby-red);
            color: var(--gold-light);
            font-weight: 600;
        }

        /* Container prodotti */
        .products-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        /* Card prodotto */
        .product-card {
            background: var(--bg-secondary);
            border: 1px solid var(--ruby-dark);
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(139, 0, 0, 0.3);
            border-color: var(--gold);
        }

        .product-card.sold-out {
            opacity: 0.6;
        }

        .product-image-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            overflow: hidden;
            background: #000;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .sold-out-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--ruby-red);
            color: var(--white);
            padding: 8px 15px;
            font-weight: bold;
            letter-spacing: 1px;
            border: 2px solid var(--gold);
            border-radius: 4px;
            z-index: 10;
            font-size: 0.9rem;
        }

        /* Galleria immagini */
        .image-gallery {
            position: relative;
        }

        .gallery-nav {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .gallery-dot {
            width: 10px;
            height: 10px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            cursor: pointer;
            border: 1px solid var(--gold);
            transition: all 0.3s;
        }

        .gallery-dot.active {
            background: var(--gold);
            transform: scale(1.3);
        }

        .model-3d-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(139, 0, 0, 0.9);
            color: var(--gold-light);
            border: 1px solid var(--gold);
            padding: 8px 12px;
            cursor: pointer;
            z-index: 10;
            font-size: 0.85rem;
            border-radius: 4px;
            letter-spacing: 0.5px;
        }

        /* Info prodotto */
        .product-info {
            padding: 20px;
        }

        .product-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            margin-bottom: 10px;
            color: var(--gold-light);
        }

        .product-category {
            font-size: 0.85rem;
            color: var(--text-secondary);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .product-price {
            font-size: 1.6rem;
            color: var(--gold);
            font-weight: bold;
            margin-bottom: 15px;
        }

        .size-selector {
            width: 100%;
            padding: 10px;
            background: var(--bg-primary);
            color: var(--white);
            border: 1px solid var(--gold-dark);
            border-radius: 4px;
            margin-bottom: 15px;
            font-family: 'Inter', sans-serif;
        }

        .buy-button {
            width: 100%;
            padding: 12px;
            background: var(--ruby-red);
            color: var(--white);
            border: 2px solid var(--gold);
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        .buy-button:hover {
            background: var(--ruby-dark);
            border-color: var(--gold-light);
            transform: translateY(-2px);
        }

        .buy-button.sold-out-btn {
            background: #333;
            border-color: #555;
            color: #999;
            cursor: not-allowed;
        }

        .buy-button.sold-out-btn:hover {
            background: #333;
            border-color: #555;
            transform: none;
        }

        /* Modello 3D */
        model-viewer {
            width: 100%;
            height: 100%;
            background: #000;
        }

        /* Footer */
        .footer {
            background: var(--bg-secondary);
            text-align: center;
            padding: 30px;
            margin-top: 40px;
            border-top: 2px solid var(--gold);
        }

        .footer-text {
            color: var(--text-secondary);
            margin-top: 10px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .logo {
                font-size: 2.5rem;
            }
            
            .products-container {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 15px;
                padding: 20px 10px;
            }
        }
    </style>
</head>
<body>
    <!-- Banner Spedizioni -->
    <div class="shipping-banner">
        🌍 Spedizioni disponibili in tutto il mondo 🌍
    </div>

    <!-- Header -->
    <header class="header">
        <h1 class="logo">Shop87</h1>
        <a href="https://instagram.com/87shopp_" class="instagram-link" target="_blank">@87shopp_</a>
    </header>

    <!-- Menu Navigazione con tendina -->
    <nav class="nav-menu" id="navMenu">
        <div class="category-dropdown">
            <button class="category-btn" id="categoryBtn" onclick="toggleCategoryMenu()">
                Categorie
            </button>
            <div class="category-menu" id="categoryMenu">
                <!-- Le voci verranno generate dinamicamente da JavaScript -->
            </div>
        </div>
    </nav>

    <!-- Container Prodotti -->
    <main class="products-container" id="productsContainer">
        <!-- I prodotti verranno caricati dinamicamente da JavaScript -->
    </main>

    <!-- Footer -->
    <footer class="footer">
        <h2 class="logo" style="font-size: 2rem;">Shop87</h2>
        <a href="https://instagram.com/87shopp_" class="instagram-link" target="_blank">@87shopp_</a>
        <div class="footer-text">
            <p>🌍 Spedizioni disponibili in tutto il mondo 🌍</p>
            <p style="margin-top: 10px; color: var(--gold);">Contattaci su Instagram per acquisti</p>
        </div>
    </footer>

    <script>
        // Dati prodotti di ANTEPRIMA (solo per test)
        const productsData = [
            {
                id: 1,
                name: "Nike Air Jordan 1 Retro High",
                category: "Sneakers",
                price: "€180.00",
                sizes: ["39", "40", "41", "42", "43", "44"],
                available: true,
                images: [
                    "https://images.unsplash.com/photo-1549298916-b41d501d3772?w=800",
                    "https://images.unsplash.com/photo-1600269452121-4f2416e55c28?w=800"
                ],
                model3d: null,
                description: "Iconiche sneakers in pelle premium - PRODOTTO DI TEST"
            }
        ];

        // Categorie per il menu di navigazione (senza "Scarpe per bambini")
        const categories = [
            'Tutti', 'Sneakers', 'Scarpe da uomo', 
            'Scarpe da donna', 'Ciabatte', 'Giacca invernale', 'Giacca', 
            'Felpe', 'Pantaloni', 'Maglietta', 'Borsa', 'Tuta sportiva', 
            'Cintura', 'Cappello', 'Occhiali da sole', 'Orologio'
        ];

        // Stato dell'applicazione
        let currentCategory = 'Tutti';
        let currentImageIndex = {};
        let currentSizes = {};

        // Inizializzazione
        function init() {
            renderNavMenu();
            renderProducts();
        }

        // Render menu di navigazione (tendina)
        function renderNavMenu() {
            const menu = document.getElementById('categoryMenu');
            menu.innerHTML = '';
            
            categories.forEach(category => {
                const item = document.createElement('button');
                item.className = 'category-item' + (category === currentCategory ? ' active' : '');
                item.textContent = category;
                item.onclick = () => {
                    filterProducts(category);
                    closeCategoryMenu();
                };
                menu.appendChild(item);
            });
        }

        // Apri/chiudi il menu a tendina
        function toggleCategoryMenu() {
            const menu = document.getElementById('categoryMenu');
            const btn = document.getElementById('categoryBtn');
            menu.classList.toggle('open');
            btn.classList.toggle('open');
        }

        // Chiudi il menu
        function closeCategoryMenu() {
            const menu = document.getElementById('categoryMenu');
            const btn = document.getElementById('categoryBtn');
            menu.classList.remove('open');
            btn.classList.remove('open');
        }

        // Chiudi il menu se clicchi fuori
        document.addEventListener('click', function(event) {
            const dropdown = document.querySelector('.category-dropdown');
            if (dropdown && !dropdown.contains(event.target)) {
                closeCategoryMenu();
            }
        });

        // Filtra prodotti
        function filterProducts(category) {
            currentCategory = category;
            renderNavMenu();
            renderProducts();
        }

        // Render prodotti
        function renderProducts() {
            const container = document.getElementById('productsContainer');
            container.innerHTML = '';
            
            const filteredProducts = currentCategory === 'Tutti' 
                ? productsData 
                : productsData.filter(product => product.category === currentCategory);
            
            if (filteredProducts.length === 0) {
                container.innerHTML = '<p style="text-align:center;width:100%;">Nessun prodotto disponibile in questa categoria.</p>';
                return;
            }
            
            filteredProducts.forEach(product => {
                const card = createProductCard(product);
                container.appendChild(card);
            });
        }

        // Crea card prodotto
        function createProductCard(product) {
            const card = document.createElement('div');
            card.className = 'product-card' + (product.available ? '' : ' sold-out');
            
            // Container immagine
            const imageContainer = document.createElement('div');
            imageContainer.className = 'image-gallery';
            
            // Badge sold out
            if (!product.available) {
                const soldOutBadge = document.createElement('div');
                soldOutBadge.className = 'sold-out-badge';
                soldOutBadge.textContent = 'SOLD OUT';
                imageContainer.appendChild(soldOutBadge);
            }
            
            // Pulsante 3D se disponibile
            if (product.model3d) {
                const modelBtn = document.createElement('button');
                modelBtn.className = 'model-3d-btn';
                modelBtn.textContent = '🔄 Vista 3D 360°';
                modelBtn.onclick = () => toggle3DModel(product.id);
                imageContainer.appendChild(modelBtn);
            }
            
            // Immagine principale
            const imageContainerInner = document.createElement('div');
            imageContainerInner.className = 'product-image-container';
            imageContainerInner.id = `image-container-${product.id}`;
            
            const img = document.createElement('img');
            img.className = 'product-image';
            img.src = product.images[0];
            img.alt = product.name;
            img.id = `main-image-${product.id}`;
            imageContainerInner.appendChild(img);
            
            imageContainer.appendChild(imageContainerInner);
            
            // Navigazione galleria
            if (product.images.length > 1) {
                const galleryNav = document.createElement('div');
                galleryNav.className = 'gallery-nav';
                
                product.images.forEach((image, index) => {
                    const dot = document.createElement('div');
                    dot.className = 'gallery-dot' + (index === 0 ? ' active' : '');
                    dot.onclick = () => changeImage(product.id, index);
                    galleryNav.appendChild(dot);
                });
                
                imageContainer.appendChild(galleryNav);
            }
            
            card.appendChild(imageContainer);
            
            // Info prodotto
            const info = document.createElement('div');
            info.className = 'product-info';
            
            const name = document.createElement('h3');
            name.className = 'product-name';
            name.textContent = product.name;
            info.appendChild(name);
            
            const category = document.createElement('div');
            category.className = 'product-category';
            category.textContent = product.category;
            info.appendChild(category);
            
            const price = document.createElement('div');
            price.className = 'product-price';
            price.textContent = product.price;
            info.appendChild(price);
            
            // Selettore taglia
            if (product.sizes && product.sizes.length > 0) {
                const sizeSelector = document.createElement('select');
                sizeSelector.className = 'size-selector';
                sizeSelector.id = `size-selector-${product.id}`;
                
                product.sizes.forEach(size => {
                    const option = document.createElement('option');
                    option.value = size;
                    option.textContent = `Taglia: ${size}`;
                    sizeSelector.appendChild(option);
                });
                
                sizeSelector.onchange = (e) => {
                    currentSizes[product.id] = e.target.value;
                };
                
                // Imposta taglia di default
                currentSizes[product.id] = product.sizes[0];
                
                info.appendChild(sizeSelector);
            }
            
            // Bottone acquista
            const buyButton = document.createElement('button');
            buyButton.className = 'buy-button' + (product.available ? '' : ' sold-out-btn');
            
            if (product.available) {
                buyButton.textContent = 'Acquista ora';
                buyButton.onclick = () => buyOnInstagram(product);
            } else {
                buyButton.textContent = 'ESAURITO';
                buyButton.disabled = true;
            }
            
            info.appendChild(buyButton);
            card.appendChild(info);
            
            return card;
        }

        // Cambia immagine nella galleria
        function changeImage(productId, index) {
            const img = document.getElementById(`main-image-${productId}`);
            const product = productsData.find(p => p.id === productId);
            
            if (img && product) {
                img.src = product.images[index];
                
                // Aggiorna dots
                const dots = document.querySelectorAll(`#image-container-${productId}`).parentElement.querySelectorAll('.gallery-dot');
                dots.forEach((dot, i) => {
                    dot.className = 'gallery-dot' + (i === index ? ' active' : '');
                });
            }
        }

        // Toggle modello 3D
        function toggle3DModel(productId) {
            const container = document.getElementById(`image-container-${productId}`);
            const product = productsData.find(p => p.id === productId);
            
            if (!product || !product.model3d) return;
            
            // Se già in modalità 3D, torna alle immagini
            if (container.querySelector('model-viewer')) {
                const modelViewer = container.querySelector('model-viewer');
                modelViewer.remove();
                
                const img = document.createElement('img');
                img.className = 'product-image';
                img.src = product.images[0];
                img.alt = product.name;
                img.id = `main-image-${productId}`;
                container.appendChild(img);
            } else {
                // Pulisci container
                container.innerHTML = '';
                
                // Crea model viewer
                const modelViewer = document.createElement('model-viewer');
                modelViewer.src = product.model3d;
                modelViewer.alt = `Modello 3D di ${product.name}`;
                modelViewer.setAttribute('auto-rotate', '');
                modelViewer.setAttribute('camera-controls', '');
                modelViewer.setAttribute('ar', '');
                modelViewer.setAttribute('ar-modes', 'webxr scene-viewer quick-look');
                modelViewer.setAttribute('shadow-intensity', '1');
                modelViewer.style.width = '100%';
                modelViewer.style.height = '100%';
                
                container.appendChild(modelViewer);
            }
        }

        // Acquista su Instagram
        function buyOnInstagram(product) {
            const size = currentSizes[product.id] || (product.sizes ? product.sizes[0] : '');
            
            // Costruisci il messaggio SENZA codificare i singoli pezzi
            const message = `Ciao! Sono interessato all'articolo: ${product.name} (Taglia: ${size}). È ancora disponibile?`;
            
            // Codifica UNA SOLA VOLTA l'intero messaggio
            const instagramUrl = `https://ig.me/m/87shopp_?text=${encodeURIComponent(message)}`;
            
            window.open(instagramUrl, '_blank');
        }

        // Avvia l'applicazione
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
