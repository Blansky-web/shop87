backend:
  name: github
  repo: Blansky-web/shop87
  branch: main
  base_url: https://sveltia-cms-auth.netlify.app # URL pubblico del servizio OAuth di Netlify
  auth_endpoint: /auth

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "prodotti"
    label: "Prodotti"
    folder: "products"
    create: true
    slug: "{{slug}}"
    format: "json"
    fields:
      - { label: "ID", name: "id", widget: "number", required: true }
      - { label: "Nome Prodotto", name: "name", widget: "string", required: true }
      - { label: "Categoria", name: "category", widget: "select", options:
          ["Sneakers", "Scarpe per bambini", "Scarpe da uomo", "Scarpe da donna",
           "Ciabatte", "Giacca invernale", "Giacca", "Felpe", "Pantaloni",
           "Maglietta", "Borsa", "Tuta sportiva", "Cintura", "Cappello",
           "Occhiali da sole", "Orologio"], required: true }
      - { label: "Prezzo", name: "price", widget: "string", required: true }
      - { label: "Taglie", name: "sizes", widget: "list", required: false,
          default: ["39", "40", "41", "42", "43", "44"] }
      - { label: "Disponibile", name: "available", widget: "boolean", default: true }
      - { label: "Descrizione", name: "description", widget: "text", required: false }
      - label: "Immagini"
        name: "images"
        widget: "list"
        required: true
        field:
          label: "Immagine"
          name: "image"
          widget: "image"
          media_folder: "uploads/products"
          public_folder: "/uploads/products"
      - { label: "Modello 3D (.glb/.gltf)", name: "model3d", widget: "string", required: false,
          hint: "URL del file .glb o .gltf per la visualizzazione 3D" }
